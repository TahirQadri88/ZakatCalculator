# Deploys to the live site — but only after the test suite passes.
# The `needs: test` on build_and_deploy is what makes this a gate rather than
# a notification: a failing test means the deploy step never runs and
# zakathisab.web.app keeps serving the last good version.

name: Test and deploy to Firebase Hosting
on:
  push:
    branches:
      - main
      - claude/tender-keller-vmrapr

jobs:
  test:
    # Pinned: @playwright/test 1.40.0 (see CLAUDE.md §4) asks for libasound2,
    # which Ubuntu 24.04 renamed to libasound2t64. On ubuntu-latest the browser
    # install fails with "Package 'libasound2' has no installation candidate".
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2          # need the previous commit for the cache-bump check

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The runner has no pre-installed Chromium, so Playwright fetches the
      # revision matching the pinned 1.40.0 (see playwright.config.js).
      - run: npx playwright install --with-deps chromium

      - name: Service worker cache bump
        run: bash scripts/check-cache-bump.sh "${{ github.event.before }}"

      - name: Playwright tests
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  build_and_deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZAKATHISAB }}
          channelId: live
          projectId: zakathisab
